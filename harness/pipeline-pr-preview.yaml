# PR preview — build + ephemeral Helm release (must NOT touch stable samples ns).
# Deploys to samples-pr-sample-python-<pr> with host sample-python-pr-<n>.burnsy.me.
# Teardown deletes that namespace (see pipeline-pr-teardown.yaml).
pipeline:
  name: PR Preview sample-python
  identifier: PR_Preview_sample_python
  projectIdentifier: sample_apps
  orgIdentifier: default
  tags:
    app: sample-python
    deploy: pr-preview
  properties:
    ci:
      codebase:
        connectorRef: github_sample_apps
        repoName: sample-python
        build: <+input>
  variables:
    - name: imageRepo
      type: String
      value: sample-python
    - name: imageTag
      type: String
      value: pr-<+trigger.prNumber>
    - name: previewNamespace
      type: String
      value: samples-pr-sample-python-<+trigger.prNumber>
    - name: previewHost
      type: String
      value: sample-python-pr-<+trigger.prNumber>.burnsy.me
  stages:
    - stage:
        name: Build
        identifier: Build
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: local_kind_k8s
              namespace: harness-ci
              automountServiceAccountToken: true
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Build and Push
                  identifier: Build_and_Push
                  spec:
                    connectorRef: dockerhub_public
                    image: gcr.io/kaniko-project/executor:v1.23.2-debug
                    shell: Sh
                    command: |-
                      set -e
                      REGISTRY="zot.harness-ci.svc.cluster.local:5000"
                      REPO="<+pipeline.variables.imageRepo>"
                      TAG="<+pipeline.variables.imageTag>"
                      /kaniko/executor \
                        --dockerfile=Dockerfile \
                        --context=dir:///harness \
                        --destination="${REGISTRY}/${REPO}:${TAG}" \
                        --insecure \
                        --skip-tls-verify \
                        --ignore-path=/product_uuid \
                        --snapshot-mode=redo
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: Abort
    - stage:
        name: Preview
        identifier: Preview
        description: Helm install into PR-isolated namespace (not samples / python-sample.burnsy.me)
        type: Custom
        when:
          pipelineStatus: Success
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Helm Preview Isolated
                  identifier: Helm_Preview_Isolated
                  timeout: 10m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -euo pipefail
                          NS="<+pipeline.variables.previewNamespace>"
                          HOST="<+pipeline.variables.previewHost>"
                          TAG="<+pipeline.variables.imageTag>"
                          REPO="<+pipeline.variables.imageRepo>"
                          COMMIT="<+codebase.commitSha>"
                          echo "Preview ns=${NS} host=${HOST} tag=${TAG} commit=${COMMIT}"
                          case "$NS" in
                            samples-pr-sample-python-*) ;;
                            *)
                              echo "Refusing preview deploy outside samples-pr-sample-python-* (got ${NS})"
                              exit 1
                              ;;
                          esac
                          WORK="$(mktemp -d)"
                          git clone --depth 50 https://github.com/Ironmanburns/sample-python.git "$WORK/repo"
                          git -C "$WORK/repo" fetch --depth 50 origin "$COMMIT"
                          git -C "$WORK/repo" checkout "$COMMIT"
                          kubectl create namespace "${NS}" --dry-run=client -o yaml | kubectl apply -f -
                          helm upgrade --install sample-python "$WORK/repo/charts/sample-python" \
                            --namespace "${NS}" \
                            --set "image.repository=localhost:5001/${REPO}" \
                            --set "image.tag=${TAG}" \
                            --set "ingress.host=${HOST}" \
                            --wait --timeout 5m
                          rm -rf "$WORK"
                    onDelegate: true
                    delegateSelectors:
                      - local-kind
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
