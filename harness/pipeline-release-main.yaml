# Release on push to main — creates v* tag only (no stable deploy).
# Register trigger: GitHub push to branch main.
# Pair with pipeline-deploy-tag.yaml (trigger: tag v*).
# Placeholders sample-python / sample_python substituted by generate.sh.
pipeline:
  name: Release sample-python Main
  identifier: Release_sample_python_Main
  projectIdentifier: sample_apps
  orgIdentifier: default
  tags:
    app: sample-python
    release: semver-main
  properties:
    ci:
      codebase:
        connectorRef: github_sample_apps
        repoName: sample-python
        build: <+input>
        depth: 0
  stages:
    - stage:
        name: Release
        identifier: Release
        description: Conventional commits → annotated v* tag (+ optional GH Release)
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: local_kind_k8s
              namespace: harness-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Guard main branch
                  identifier: Guard_main_branch
                  spec:
                    connectorRef: dockerhub_public
                    image: alpine:3.20
                    shell: Sh
                    command: |-
                      set -e
                      BRANCH="<+codebase.branch>"
                      echo "codebase.branch=${BRANCH}"
                      if [ "$BRANCH" != "main" ]; then
                        echo "Release pipeline only runs for main (got ${BRANCH})"
                        exit 1
                      fi
              - step:
                  type: Run
                  name: Semver tag release
                  identifier: Semver_tag_release
                  spec:
                    connectorRef: dockerhub_public
                    image: alpine:3.20
                    shell: Sh
                    # Prefer GitHub App mint; fall back to legacy PAT if PEM secret is bad.
                    # Live pipelines are managed by terraform/sample-apps (embeds mint script).
                    envVariables:
                      GITHUB_APP_ID: <+secrets.getValue("github_release_app_id")>
                      GITHUB_APP_PRIVATE_KEY: <+secrets.getValue("github_release_app_private_key")>
                      GITHUB_RELEASE_TOKEN_FALLBACK: <+secrets.getValue("github_release_token")>
                      GITHUB_APP_OWNER: Ironmanburns
                      GITHUB_REPOSITORY: Ironmanburns/sample-python
                      RELEASE_BRANCH: main
                      CREATE_GITHUB_RELEASE: "true"
                    command: |-
                      set -e
                      apk add --no-cache git bash python3 openssl curl >/dev/null
                      # Harness clones codebase to /harness; Run step cwd is not always that.
                      cd /harness
                      git config --global --add safe.directory /harness
                      chmod +x scripts/mint-github-app-token.sh scripts/harness-semver-release.sh
                      if GITHUB_TOKEN="$(bash scripts/mint-github-app-token.sh 2>/tmp/mint.err)"; then
                        echo "Using GitHub App installation token"
                      elif [ -n "${GITHUB_RELEASE_TOKEN_FALLBACK:-}" ]; then
                        echo "WARN: App mint failed ($(cat /tmp/mint.err | tr '\n' ' ')); falling back to github_release_token" >&2
                        GITHUB_TOKEN="$GITHUB_RELEASE_TOKEN_FALLBACK"
                      else
                        echo "ERROR: App mint failed and no github_release_token fallback" >&2
                        cat /tmp/mint.err >&2 || true
                        exit 1
                      fi
                      export GITHUB_TOKEN
                      test -n "$GITHUB_TOKEN"
                      bash scripts/harness-semver-release.sh
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
